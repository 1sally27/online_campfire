<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>온라인 모닥불</title>
  <style>
    :root {
      --sky-top: #10182b;
      --sky-bottom: #253552;
      --ground: #182118;
      --panel: rgba(10, 14, 24, 0.72);
      --panel-border: rgba(255, 255, 255, 0.13);
      --text: #fff7e8;
      --muted: rgba(255, 247, 232, 0.68);
      --accent: #ffb45f;
      --accent-2: #ff7d43;
      --wood: #7a4c31;
      --wood-dark: #4a2d22;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #10182b;
      color: var(--text);
    }

    body {
      position: relative;
    }

    button,
    input {
      font: inherit;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 68%, rgba(255, 147, 62, 0.12), transparent 28%),
        linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 62%, #2d3d39 63%, var(--ground) 100%);
      transition: background 0.8s ease;
    }

    .scene.rainy {
      background:
        radial-gradient(circle at 50% 68%, rgba(255, 129, 68, 0.08), transparent 24%),
        linear-gradient(to bottom, #182130 0%, #2d3844 62%, #303c3a 63%, #171d18 100%);
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.75;
      transition: opacity 0.5s ease;
    }

    .rainy .stars {
      opacity: 0.08;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      animation: twinkle 2.4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.28; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.35); }
    }

    .moon {
      position: absolute;
      top: 7vh;
      right: 9vw;
      width: 88px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f7edcb;
      box-shadow: 0 0 48px rgba(255, 244, 206, 0.24);
      opacity: 0.9;
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #172036;
      top: -6px;
      left: 25px;
    }

    .cloud {
      position: absolute;
      width: 220px;
      height: 48px;
      border-radius: 999px;
      background: rgba(78, 88, 104, 0.82);
      filter: blur(1px);
      animation: cloudMove linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 90px;
      height: 80px;
      left: 38px;
      top: -33px;
    }

    .cloud::after {
      width: 110px;
      height: 95px;
      right: 22px;
      top: -42px;
    }

    .cloud.one {
      top: 12vh;
      left: -260px;
      opacity: 0.48;
      animation-duration: 36s;
    }

    .cloud.two {
      top: 25vh;
      left: -330px;
      opacity: 0.26;
      transform: scale(0.72);
      animation-duration: 48s;
      animation-delay: -18s;
    }

    @keyframes cloudMove {
      to { left: calc(100% + 280px); }
    }

    .ground-shadow {
      position: absolute;
      left: 50%;
      bottom: 13vh;
      transform: translateX(-50%);
      width: min(58vw, 760px);
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,.55), rgba(0,0,0,0) 68%);
      filter: blur(3px);
    }

    .header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 30;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0,0,0,.18);
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 30;
      min-width: 170px;
      padding: 13px 15px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0,0,0,.18);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      font-size: 13px;
    }

    .status-row + .status-row {
      margin-top: 8px;
    }

    .status strong {
      color: #ffd397;
    }

    .campfire-wrap {
      position: absolute;
      left: 50%;
      bottom: 20vh;
      transform: translateX(-50%);
      width: 360px;
      height: 340px;
      z-index: 10;
    }

    .glow {
      position: absolute;
      left: 50%;
      bottom: 35px;
      width: 260px;
      height: 150px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 151, 66, .48), rgba(255, 108, 44, .15) 46%, transparent 72%);
      filter: blur(20px);
      opacity: .8;
      transition: transform .4s ease, opacity .4s ease;
    }

    .logs {
      position: absolute;
      left: 50%;
      bottom: 36px;
      width: 190px;
      height: 70px;
      transform: translateX(-50%);
      z-index: 5;
    }

    .log {
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 145px;
      height: 34px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, transparent 0 24px, rgba(255,255,255,.05) 25px 27px),
        linear-gradient(to bottom, #946142, var(--wood));
      box-shadow: inset 0 -7px 0 rgba(0,0,0,.18), 0 10px 14px rgba(0,0,0,.25);
      border: 2px solid rgba(58, 31, 22, .55);
      transform-origin: center;
      transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
    }

    .log::before,
    .log::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 28px;
      height: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #a76f4f 0 18%, #78462f 20% 40%, #b27b58 42% 46%, #6e3d2b 48%);
      border: 2px solid rgba(62, 31, 23, .65);
    }

    .log::before { left: -2px; }
    .log::after { right: -2px; }

    .log.a { transform: translateX(-50%) rotate(18deg); }
    .log.b { transform: translateX(-50%) rotate(-18deg); }

    .extra-log {
      opacity: 0;
    }

    .fire {
      --fire-scale: 1;
      position: absolute;
      left: 50%;
      bottom: 62px;
      width: 160px;
      height: 210px;
      transform: translateX(-50%) scale(var(--fire-scale));
      transform-origin: center bottom;
      z-index: 6;
      transition: transform .55s cubic-bezier(.2,.8,.2,1), filter .4s ease;
      filter: drop-shadow(0 0 14px rgba(255, 112, 42, .65));
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 0;
      border-radius: 55% 45% 60% 40% / 65% 58% 42% 35%;
      transform-origin: 50% 100%;
      animation: flicker .85s ease-in-out infinite alternate;
    }

    .flame.outer {
      width: 120px;
      height: 165px;
      transform: translateX(-50%) rotate(45deg);
      background: linear-gradient(135deg, #ff6a2f 0%, #ff9d39 60%, #ffd06f 100%);
      opacity: .96;
    }

    .flame.mid {
      width: 82px;
      height: 122px;
      transform: translateX(-50%) rotate(45deg);
      background: linear-gradient(135deg, #ffac3f 0%, #ffd76a 58%, #fff2a9 100%);
      animation-duration: .65s;
    }

    .flame.inner {
      width: 46px;
      height: 74px;
      transform: translateX(-50%) rotate(45deg);
      background: linear-gradient(135deg, #fff1a8, #fff9d2);
      animation-duration: .5s;
    }

    .ember {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffc66a;
      box-shadow: 0 0 9px #ff873c;
      animation: emberFly 2.3s linear infinite;
      opacity: 0;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) rotate(45deg) scaleX(.92) scaleY(.98); }
      100% { transform: translateX(-50%) rotate(42deg) scaleX(1.05) scaleY(1.06); }
    }

    @keyframes emberFly {
      0% { transform: translate(0, 0) scale(.7); opacity: 0; }
      18% { opacity: 1; }
      100% { transform: translate(var(--dx), -145px) scale(0); opacity: 0; }
    }

    .person {
      position: absolute;
      bottom: 58px;
      width: 48px;
      height: 78px;
      z-index: 7;
      transform-origin: center bottom;
      animation: personIn .45s ease both;
    }

    .person .head {
      position: absolute;
      left: 11px;
      top: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--skin, #d6a271);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.08);
    }

    .person .body {
      position: absolute;
      left: 7px;
      top: 24px;
      width: 34px;
      height: 40px;
      border-radius: 14px 14px 10px 10px;
      background: var(--shirt, #6f86a8);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,.12);
    }

    .person .legs {
      position: absolute;
      left: 5px;
      bottom: 0;
      width: 38px;
      height: 20px;
      border-radius: 14px;
      background: #313642;
      transform: rotate(var(--leg-rotate, 0deg));
    }

    @keyframes personIn {
      from { opacity: 0; transform: translateY(14px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .speech-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .speech {
      position: absolute;
      max-width: min(240px, 45vw);
      padding: 10px 13px;
      border-radius: 16px;
      color: #2b241d;
      background: rgba(255, 250, 238, .95);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      animation: bubbleFloat 6s ease-out forwards;
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 28px;
      bottom: -8px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid rgba(255, 250, 238, .95);
    }

    @keyframes bubbleFloat {
      0% { opacity: 0; transform: translateY(14px) scale(.92); }
      10% { opacity: 1; transform: translateY(0) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-46px) scale(.98); }
    }

    .rain {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      z-index: 18;
      overflow: hidden;
    }

    .rain.active {
      display: block;
    }

    .drop {
      position: absolute;
      top: -40px;
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, transparent, rgba(207, 227, 255, .72));
      transform: rotate(12deg);
      animation: rainFall linear infinite;
    }

    @keyframes rainFall {
      to { transform: translate(120px, calc(100vh + 70px)) rotate(12deg); }
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 26px;
      z-index: 40;
      width: min(760px, calc(100% - 32px));
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(9, 13, 21, .76);
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 38px rgba(0,0,0,.3);
    }

    .log-button,
    .send-button {
      border: 0;
      color: #2e2016;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease;
    }

    .log-button {
      min-width: 132px;
      padding: 13px 16px;
      border-radius: 14px;
      background: linear-gradient(to bottom, #ffd38f, #f6a74f);
      box-shadow: inset 0 -4px 0 rgba(125, 65, 27, .18), 0 6px 16px rgba(255, 133, 55, .16);
    }

    .send-button {
      min-width: 74px;
      padding: 13px 16px;
      border-radius: 14px;
      background: linear-gradient(to bottom, #fff1ca, #ffcf88);
    }

    .log-button:hover,
    .send-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .log-button:active,
    .send-button:active {
      transform: translateY(1px) scale(.99);
    }

    .chat-input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255,255,255,.12);
      outline: none;
      border-radius: 14px;
      padding: 13px 15px;
      color: var(--text);
      background: rgba(255,255,255,.08);
    }

    .chat-input::placeholder {
      color: rgba(255,255,255,.42);
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 92px;
      transform: translateX(-50%);
      z-index: 50;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(9,13,21,.82);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      animation: toastShow 2.2s ease forwards;
    }

    @keyframes toastShow {
      0% { opacity: 0; transform: translate(-50%, -8px); }
      15%, 75% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -6px); }
    }

    @media (max-width: 720px) {
      html,
      body {
        min-height: 100%;
        height: 100dvh;
      }

      .scene {
        min-height: 100dvh;
      }

      .header {
        top: max(10px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        width: auto;
        padding: 11px 13px;
        border-radius: 15px;
      }

      .title {
        font-size: 16px;
      }

      .header .subtitle {
        margin-top: 4px;
        font-size: 11px;
      }

      .status {
        top: calc(max(10px, env(safe-area-inset-top)) + 70px);
        left: 12px;
        right: 12px;
        bottom: auto;
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px 10px;
        padding: 10px 12px;
        border-radius: 15px;
      }

      .status-row {
        display: block;
        text-align: center;
        font-size: 11px;
      }

      .status-row + .status-row {
        margin-top: 0;
      }

      .status-row strong {
        display: block;
        margin-top: 3px;
        font-size: 13px;
      }

      #locationStatus {
        grid-column: 1 / -1;
        margin-top: 1px;
        text-align: center;
        font-size: 10px;
      }

      .moon {
        top: 20vh;
        right: 7vw;
        width: 58px;
      }

      .campfire-wrap {
        bottom: 20vh;
        width: 320px;
        height: 310px;
        transform: translateX(-50%) scale(.82);
      }

      .ground-shadow {
        bottom: 16vh;
        width: 92vw;
      }

      .controls {
        left: 10px;
        right: 10px;
        bottom: max(10px, env(safe-area-inset-bottom));
        width: auto;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 9px;
        border-radius: 15px;
      }

      .log-button {
        grid-column: 1 / -1;
        min-width: 0;
        width: 100%;
        padding: 11px 14px;
      }

      .chat-input,
      .send-button {
        padding-top: 11px;
        padding-bottom: 11px;
      }

      .send-button {
        min-width: 66px;
      }

      .speech {
        max-width: 72vw;
        font-size: 13px;
      }

      .toast {
        top: 154px;
        max-width: calc(100% - 28px);
        text-align: center;
      }
    }

    @media (max-width: 420px) {
      .campfire-wrap {
        bottom: 22vh;
        transform: translateX(-50%) scale(.72);
      }

      .person {
        transform: scale(.9);
      }

      .moon {
        top: 22vh;
        width: 50px;
      }
    }

    @media (max-height: 700px) and (max-width: 720px) {
      .header {
        padding: 9px 11px;
      }

      .header .subtitle {
        display: none;
      }

      .status {
        top: calc(max(10px, env(safe-area-inset-top)) + 52px);
        padding: 8px 10px;
      }

      #locationStatus {
        display: none;
      }

      .campfire-wrap {
        bottom: 20vh;
        transform: translateX(-50%) scale(.66);
      }

      .controls {
        padding: 8px;
      }

      .log-button,
      .chat-input,
      .send-button {
        padding-top: 9px;
        padding-bottom: 9px;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="rain" id="rain"></div>

    <section class="header">
      <h1 class="title">온라인 모닥불</h1>
      <div class="subtitle">잠깐 앉았다가 가세요.</div>
    </section>

    <aside class="status">
      <div class="status-row"><span>장작</span><strong id="woodCount">1개</strong></div>
      <div class="status-row"><span>함께 있는 사람</span><strong id="peopleCount">3명</strong></div>
      <div class="status-row"><span>날씨</span><strong id="weatherText">위치 확인 중</strong></div>
      <div class="subtitle" id="locationStatus">위치 권한을 허용해 주세요.</div>
    </aside>

    <div class="toast" id="toast">장작을 넣었습니다.</div>

    <div class="ground-shadow"></div>

    <section class="campfire-wrap" id="campfireWrap">
      <div class="glow" id="glow"></div>

      <div class="person" style="left: 10px; --shirt:#6c7da1; --skin:#d4a172;">
        <span class="head"></span><span class="body"></span><span class="legs"></span>
      </div>
      <div class="person" style="right: 2px; --shirt:#9f725f; --skin:#bd845f; transform:scaleX(-1);">
        <span class="head"></span><span class="body"></span><span class="legs"></span>
      </div>
      <div class="person" style="left: 56px; bottom: 26px; --shirt:#6d8c73; --skin:#e0ad82; transform:scale(.82);">
        <span class="head"></span><span class="body"></span><span class="legs"></span>
      </div>

      <div class="logs" id="logs">
        <div class="log a"></div>
        <div class="log b"></div>
      </div>

      <div class="fire" id="fire">
        <div class="flame outer"></div>
        <div class="flame mid"></div>
        <div class="flame inner"></div>
      </div>
    </section>

    <div class="speech-layer" id="speechLayer"></div>

    <section class="controls">
      <button class="log-button" id="logButton">🪵 장작 넣기</button>
      <input
        class="chat-input"
        id="chatInput"
        type="text"
        maxlength="60"
        autocomplete="off"
        placeholder="불 앞에 한마디 남겨보세요"
      />
      <button class="send-button" id="sendButton">보내기</button>
    </section>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const stars = document.getElementById("stars");
    const rain = document.getElementById("rain");
    const weatherText = document.getElementById("weatherText");
    const woodCountEl = document.getElementById("woodCount");
    const peopleCountEl = document.getElementById("peopleCount");
    const fire = document.getElementById("fire");
    const glow = document.getElementById("glow");
    const logs = document.getElementById("logs");
    const logButton = document.getElementById("logButton");
    const chatInput = document.getElementById("chatInput");
    const sendButton = document.getElementById("sendButton");
    const speechLayer = document.getElementById("speechLayer");
    const toast = document.getElementById("toast");

    const state = {
      wood: Number(localStorage.getItem("campfireWood") || 1),
      rainy: false,
      people: 3
    };

    const idleMessages = [
      "퇴근하고 싶다",
      "불 좋다",
      "다들 오늘도 버텨요",
      "조용해서 좋네",
      "장작 하나 놓고 갑니다",
      "커피 마시는 중",
      "오늘은 좀 춥다",
      "불멍 중",
      "아무 말 없이 있다 갈게요",
      "퇴근까지 조금만 더"
    ];

    function createStars() {
      const count = 58;
      for (let i = 0; i < count; i++) {
        const star = document.createElement("span");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 58 + "%";
        star.style.animationDelay = (Math.random() * 2.4).toFixed(2) + "s";
        star.style.opacity = (0.25 + Math.random() * 0.75).toFixed(2);
        stars.appendChild(star);
      }
    }

    function createRain() {
      const count = 95;
      for (let i = 0; i < count; i++) {
        const drop = document.createElement("span");
        drop.className = "drop";
        drop.style.left = Math.random() * 100 + "%";
        drop.style.animationDuration = (0.65 + Math.random() * 0.55).toFixed(2) + "s";
        drop.style.animationDelay = (-Math.random() * 1.4).toFixed(2) + "s";
        drop.style.opacity = (0.22 + Math.random() * 0.5).toFixed(2);
        rain.appendChild(drop);
      }
    }

    function getFireScale() {
      if (state.wood <= 1) return 0.34;
      if (state.wood <= 4) return 0.48 + state.wood * 0.04;
      if (state.wood <= 10) return 0.68 + (state.wood - 4) * 0.035;
      if (state.wood <= 25) return 0.88 + (state.wood - 10) * 0.016;
      return Math.min(1.34, 1.12 + Math.log10(state.wood / 25 + 1) * 0.16);
    }

    function renderLogs() {
      const wanted = Math.min(10, Math.max(0, Math.floor((state.wood - 1) / 3)));
      const current = logs.querySelectorAll(".extra-log").length;

      if (current < wanted) {
        for (let i = current; i < wanted; i++) {
          const log = document.createElement("div");
          log.className = "log extra-log";
          const angle = -42 + Math.random() * 84;
          const offsetY = 10 + i * 3.5;
          const width = 125 + Math.random() * 25;
          log.style.width = width + "px";
          log.style.bottom = offsetY + "px";
          log.style.transform = `translateX(-50%) rotate(${angle}deg) scale(${0.9 + Math.random() * 0.16})`;
          logs.appendChild(log);
          requestAnimationFrame(() => {
            log.style.opacity = "1";
          });
        }
      } else if (current > wanted) {
        [...logs.querySelectorAll(".extra-log")]
          .slice(wanted)
          .forEach(el => el.remove());
      }
    }

    function renderFire() {
      const scale = getFireScale();
      fire.style.setProperty("--fire-scale", scale);
      glow.style.transform = `translateX(-50%) scale(${0.72 + scale * 0.42})`;
      glow.style.opacity = String(Math.min(1, 0.48 + scale * 0.42));
      woodCountEl.textContent = `${state.wood.toLocaleString()}개`;
      peopleCountEl.textContent = `${state.people}명`;
      renderLogs();
    }

    function createEmberBurst() {
      for (let i = 0; i < 10; i++) {
        const ember = document.createElement("span");
        ember.className = "ember";
        ember.style.left = 70 + Math.random() * 28 + "px";
        ember.style.bottom = 40 + Math.random() * 20 + "px";
        ember.style.setProperty("--dx", (-40 + Math.random() * 80) + "px");
        ember.style.animationDelay = (Math.random() * 0.25) + "s";
        fire.appendChild(ember);
        setTimeout(() => ember.remove(), 2600);
      }
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function addWood(byUser = true) {
      state.wood += 1;
      localStorage.setItem("campfireWood", String(state.wood));
      renderFire();
      createEmberBurst();

      if (byUser) {
        showToast("장작을 넣었습니다. 불이 조금 커졌어요.");
      }
    }

    function weakenFire(amount = 1) {
      const before = state.wood;
      state.wood = Math.max(1, state.wood - amount);
      if (state.wood !== before) {
        localStorage.setItem("campfireWood", String(state.wood));
        renderFire();
      }
    }

    function addSpeech(text, isUser = false) {
      const clean = text.trim();
      if (!clean) return;

      const bubble = document.createElement("div");
      bubble.className = "speech";
      bubble.textContent = clean;

      const centerX = window.innerWidth / 2;
      const spread = Math.min(window.innerWidth * 0.36, 380);
      const x = centerX - spread / 2 + Math.random() * spread;
      const y = window.innerHeight * (0.42 + Math.random() * 0.18);

      bubble.style.left = Math.max(14, Math.min(window.innerWidth - 260, x)) + "px";
      bubble.style.top = y + "px";

      if (isUser) {
        bubble.style.background = "rgba(255, 232, 188, .97)";
      }

      speechLayer.appendChild(bubble);
      setTimeout(() => bubble.remove(), 6200);
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      addSpeech(text, true);
      chatInput.value = "";
      chatInput.focus();
    }

    function setRain(nextRainy, label = nextRainy ? "비" : "맑음") {
      const changed = state.rainy !== nextRainy;
      state.rainy = nextRainy;
      scene.classList.toggle("rainy", state.rainy);
      rain.classList.toggle("active", state.rainy);
      weatherText.textContent = label;

      if (changed && state.rainy) {
        showToast("현재 위치에 비가 와서 불이 더 빨리 약해집니다.");
      } else if (changed && !state.rainy) {
        showToast("현재 위치의 비가 그쳤습니다.");
      }
    }

    function weatherLabel(code, precipitation, snowfall) {
      if (snowfall > 0 || [71, 73, 75, 77, 85, 86].includes(code)) return "눈";
      if (precipitation > 0 || [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code)) return "비";
      if ([45, 48].includes(code)) return "안개";
      if ([1, 2, 3].includes(code)) return "흐림";
      return "맑음";
    }

    async function loadWeather(latitude, longitude) {
      const locationStatus = document.getElementById("locationStatus");

      try {
        const params = new URLSearchParams({
          latitude: String(latitude),
          longitude: String(longitude),
          current: "precipitation,rain,showers,snowfall,weather_code",
          timezone: "auto"
        });

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error(`날씨 요청 실패: ${response.status}`);

        const data = await response.json();
        const current = data.current || {};
        const precipitation = Number(current.precipitation || 0);
        const rainfall = Number(current.rain || 0) + Number(current.showers || 0);
        const snowfall = Number(current.snowfall || 0);
        const code = Number(current.weather_code || 0);
        const label = weatherLabel(code, precipitation, snowfall);
        const isRainy = rainfall > 0 || precipitation > 0 ||
          [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code);

        setRain(isRainy, label);
        locationStatus.textContent = "현재 위치 기준 · 10분마다 갱신";
      } catch (error) {
        console.error(error);
        weatherText.textContent = "확인 실패";
        locationStatus.textContent = "날씨 정보를 불러오지 못했습니다.";
        setRain(false, "확인 실패");
      }
    }

    function startLocationWeather() {
      const locationStatus = document.getElementById("locationStatus");

      if (!navigator.geolocation) {
        weatherText.textContent = "지원 안 됨";
        locationStatus.textContent = "이 브라우저는 위치 기능을 지원하지 않습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const { latitude, longitude } = position.coords;
          loadWeather(latitude, longitude);
          setInterval(() => loadWeather(latitude, longitude), 10 * 60 * 1000);
        },
        error => {
          console.warn("위치 권한 오류:", error);
          weatherText.textContent = "맑음";
          locationStatus.textContent = "위치 권한이 없어 기본 날씨로 표시합니다.";
          setRain(false, "맑음");
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 10 * 60 * 1000
        }
      );
    }

    logButton.addEventListener("click", () => addWood(true));
    sendButton.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });

    createStars();
    createRain();
    renderFire();
    startLocationWeather();

    setInterval(() => {
      if (Math.random() < 0.72) {
        addSpeech(idleMessages[Math.floor(Math.random() * idleMessages.length)]);
      }
    }, 5300);

    setInterval(() => {
      const change = Math.random();
      if (change < 0.38) state.people = Math.min(18, state.people + 1);
      else if (change < 0.72) state.people = Math.max(1, state.people - 1);
      peopleCountEl.textContent = `${state.people}명`;
    }, 9000);

    setInterval(() => {
      if (Math.random() < (state.rainy ? 0.72 : 0.22)) {
        weakenFire(state.rainy ? 1 + Math.floor(Math.random() * 2) : 1);
      }
    }, 7000);

    setTimeout(() => addSpeech("잠깐 쉬었다 가세요"), 900);
  </script>
</body>
</html>
